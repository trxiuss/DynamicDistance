name: DynamicDistance
version: 1.0
main: com.dynamicdistance.DynamicDistance
api-version: '1.18'
author: trxiuss
description: Ultra-Performance Proactive Dynamic View & Simulation Distance Engine.
folia-supported: true
softdepend: [LuckPerms, PlaceholderAPI]
commands:
  dynamicdistance:
    description: Main command for DynamicDistance management
    aliases: [dd, dynview, vdist]
    permission: dynamicdistance.admin
permissions:
  dynamicdistance.admin:
    description: Allows using administrative commands
    default: op
  dynamicdistance.bypass:
    description: Bypasses all dynamic distance adjustments
    default: false